name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke run (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maintained LTS lines, as in package.json "engines".
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke

  package:
    name: Smoke run of the packed CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Installs the tarball npm would publish into a fresh CommonJS project,
      # so a file missing from "files" or an ESM loading issue fails here.
      - name: Install the packed tarball
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npm init -y
          npm install "$RUNNER_TEMP"/rezo-zero-site-weight-*.tgz
          npx playwright install --with-deps chromium
      - run: node ci/smoke.js --cli "$RUNNER_TEMP/project/node_modules/@rezo-zero/site-weight/src/cli.js"
